<body>
<div class="wrap">
  <header>
    <a class="brand" href="index.html">
      <div>
        <h1><span class="dot"></span>AETHER</h1>
        <div class="sub">manifest</div>
      </div>
    </a>
    <div class="updated" id="updated"></div>
  </header>

  <section id="kpis"></section>

  <section class="gp-wrap" id="balchart"></section>

  <section>
    <h2><span class="mk">≡</span>flux · latest</h2>
    <div id="flux"></div>
    <a class="navlink" href="flux.html" style="margin-top:8px">all flux ⟢</a>
  </section>

  <section>
    <h2><span class="mk">≡</span>discharge log</h2>
    <div id="log"></div>
  </section>

  <a class="navlink" href="index.html" style="margin-top:20px">⟢ core charge</a>

  <footer>AETHER · read-only node · resync ⟢ each cycle</footer>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="chart.js"></script>
<script>
document.getElementById("updated").textContent = "sync ⟢ " + shortDate;

// vitals — same grid as the core page, derived from data.js
document.getElementById("kpis").innerHTML = vitalsGrid(vitalsItems(), 4);

// balance trace — fixed 90-day window (toggle lives on flux.html only)
mountBalanceChart(document.getElementById("balchart"), WINDOW_DAYS);

// flux — latest 3 movements only (interest excluded); full receipt on flux.html
document.getElementById("flux").innerHTML = fluxReceipt(FLUX.slice(0, 3), false);

// discharge log — pot-funded trips as one plate
// drawn at the diagram's real pixel width so its labels stay readable
const logEl = document.getElementById("log");
function drawPlate() {
  logEl.innerHTML = plateHTML();
  const sv = logEl.querySelector(".plate svg");
  if (sv) logEl.innerHTML = plateHTML(sv.getBoundingClientRect().width);
}
drawPlate();
let logW = logEl.clientWidth;
new ResizeObserver(() => { if (Math.abs(logEl.clientWidth - logW) > 2) { logW = logEl.clientWidth; drawPlate(); } }).observe(logEl);
</script>
</body>
</html>
