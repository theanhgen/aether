<head>

<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">

<body class="focus">
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <h1><span class="dot"></span>AETHER</h1>
        <div class="sub">reserve</div>
      </div>
    </div>
    <div class="updated" id="updated"></div>
  </header>

  <main class="core">
    <section class="core-l">
      <div class="vlab"><span class="mk">≡</span>core charge</div>
      <div class="now tnum"><span id="now">—</span><span class="cur">AU</span></div>
      <div class="accrued" id="accrued"></div>
      <div id="vitals"></div>
      <a class="navlink" href="manifest.html" style="margin-top:14px">manifest ⟢</a>
    </section>
    <figure class="rings" id="rings"></figure>
  </main>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script>
document.getElementById("updated").textContent = "sync ⟢ " + shortDate;
document.getElementById("vitals").innerHTML = vitalsGrid(vitalsItems(), 2);

// rings gauge — outer: total discharged to date (Σ LOG), inner: core charge (live).
// radius is linear in the amount.
const rings = document.getElementById("rings");
function drawRings() {
  rings.innerHTML = ringsSVG(
    { label: "discharged to date", amount: totalDischarged() },
    { label: "core charge", amount: liveNow() },
    rings.clientWidth
  ) + '<figcaption>radius ∝ amount · ' + LOG.length + ' burns</figcaption>';
}
drawRings();
let ringsW = rings.clientWidth;
new ResizeObserver(() => { if (Math.abs(rings.clientWidth - ringsW) > 2) { ringsW = rings.clientWidth; drawRings(); } }).observe(rings);

// live tick — balance grows as interest accrues; accrued line shows interest since sync
function tick(){
  const n = liveNow();
  document.getElementById("now").textContent = cz2(n);
  document.getElementById("accrued").textContent = "+" + cz2(n - ANCHOR.balance) + " since sync";
  const r = rings.querySelector('[data-ring="b"]'); if (r) r.textContent = cz2(n) + " AU";
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
