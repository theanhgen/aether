<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AETHER · flux</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="AETHER">
<meta property="og:description" content="reserve · read-only node">
<meta property="og:url" content="https://theanhgen.github.io/aether/">
<meta property="og:image" content="https://theanhgen.github.io/aether/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AETHER">
<meta name="twitter:description" content="reserve · read-only node">
<meta name="twitter:image" content="https://theanhgen.github.io/aether/og.png">
<link rel="stylesheet" href="aether.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="manifest.html">
      <div>
        <h1><span class="dot"></span>AETHER</h1>
        <div class="sub">flux</div>
      </div>
    </a>
    <div class="updated" id="updated"></div>
  </header>

  <div class="chart-toggle" id="btoggle">
    <button data-w="90">90d</button>
    <button data-w="all" class="on">all</button>
  </div>
  <section class="gp-wrap" id="fchart"></section>

  <section>
    <h2><span class="mk" aria-hidden="true"></span>all movements</h2>
    <div class="rc-layout">
      <div class="rc-meta">
        <div class="rc-kv" id="meta"></div>
        <div class="rc-note">this document is a record<br>of every notable movement<br>of the reserve.<br>drift is shown daily on the trace.</div>
      </div>
      <div id="flux"></div>
    </div>
  </section>

  <a class="navlink" href="manifest.html" style="margin-top:20px">← manifest</a>

  <footer>AETHER · read-only node · resync → each cycle</footer>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="chart.js"></script>
<script>
document.getElementById("updated").innerHTML = '<span class="tag">sync</span>' + shortDate;
document.getElementById("flux").innerHTML = fluxReceipt(FLUX, true);
const first = FLUX[FLUX.length - 1], last = FLUX[0];
document.getElementById("meta").innerHTML = [
  ["node", "AETHER"],
  ["period", first.date + " – " + last.date],
  ["entries", FLUX.length],
  ["last sync", anchorDate.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })],
  ["core charge", cz2(ANCHOR.balance) + " AU"]
].map(r => '<div><span>' + r[0] + '</span><span class="tnum">' + r[1] + '</span></div>').join("");

// balance trace with a 90d / full-history toggle (only on this page)
const chartRoot = document.getElementById("fchart");
mountBalanceChart(chartRoot, Infinity);   // all movements page defaults to full history
document.querySelectorAll("#btoggle button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#btoggle button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    mountBalanceChart(chartRoot, b.dataset.w === "all" ? Infinity : Number(b.dataset.w));
  };
});
</script>
</body>
</html>
