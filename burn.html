<body>
<div class="wrap wide">
  <header>
    <a class="brand" href="manifest.html">
      <div>
        <h1><span class="dot"></span>AETHER</h1>
        <div class="sub" id="sub">burn</div>
      </div>
    </a>
    <div class="updated" id="updated"></div>
  </header>

  <section>
    <h2><span class="mk">≡</span>burn profiles · thrust / berth / galley / survey / aux</h2>
    <div id="panels"></div>
  </section>

  <section class="burn-items" id="items"></section>

  <a class="navlink" href="manifest.html" style="margin-top:20px">⟢ manifest</a>
  <footer>AETHER · read-only node · resync ⟢ each cycle</footer>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script>
document.getElementById("updated").textContent = "sync ⟢ " + shortDate;

function render(scroll) {
  const id = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  const trip = tripsChrono().find(t => t.slug === id);
  document.getElementById("sub").textContent = trip ? trip.slug : "burn";
  document.getElementById("panels").innerHTML = polarPanelsHTML(trip ? trip.slug : null);

  // selected burn — its discharges as a receipt
  const box = document.getElementById("items");
  if (!trip) {
    box.innerHTML = id
      ? '<h2><span class="mk">≡</span>not found</h2><div class="chart-desc">no burn called “' + _esc(id) + '” — pick a panel</div>'
      : '<div class="chart-desc">select a panel ⟢ its discharges</div>';
    return;
  }
  const items = (trip.items || []).slice().sort((a, b) => parseDay(a.date) - parseDay(b.date));
  const pd = perUnitDay(trip);
  box.innerHTML = '<h2><span class="mk">≡</span>' + _esc(trip.no + " · " + trip.name) + ' · discharges</h2>'
    + receiptHTML(["date", "bucket", "amount AU"],
        items.map(it => [it.date, it.category || "aux", "−" + cz2(it.amount)]),
        [["total discharged", "−" + cz2(trip.total ?? 0) + " AU", "net"],
         ["per unit", cz2(trip.per ?? 0) + " AU"],
         ...(pd == null ? [] : [["per unit·day", cz2(pd) + " AU"]])]);
  if (scroll) document.getElementById(trip.slug).scrollIntoView({ block: "nearest", inline: "start" });
}
// local date parser for item dates ("05 Sep 2026")
function parseDay(s) { const m = String(s).match(/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/); return m ? Date.UTC(+m[3], _UI_MON[m[2].toLowerCase()], +m[1]) : 0; }
render(true);
window.addEventListener("hashchange", () => render(false));
</script>
</body>
</html>
